<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>
  </defs>

  <!-- Background circles -->
  <circle cx="150" cy="350" r="120" fill="url(#glow2)"/>
  <circle cx="450" cy="150" r="140" fill="url(#glow1)"/>

  <!-- Pathway from old to new -->
  <path d="M100 380 C180 380, 200 300, 250 280 S350 200, 400 180 S480 140, 500 120" stroke="url(#pathGrad)" stroke-width="3" fill="none" stroke-dasharray="8 4" opacity="0.6"/>

  <!-- School building (old life) -->
  <g transform="translate(60, 300)">
    <rect x="0" y="20" width="100" height="70" rx="4" fill="#2a3a4a" stroke="#3d5060" stroke-width="1.5"/>
    <polygon points="50,-5 0,20 100,20" fill="#2a3a4a" stroke="#3d5060" stroke-width="1.5"/>
    <rect x="15" y="35" width="16" height="18" rx="2" fill="#1a2332" stroke="#3d5060" stroke-width="1"/>
    <rect x="42" y="35" width="16" height="18" rx="2" fill="#1a2332" stroke="#3d5060" stroke-width="1"/>
    <rect x="69" y="35" width="16" height="18" rx="2" fill="#1a2332" stroke="#3d5060" stroke-width="1"/>
    <rect x="38" y="58" width="24" height="32" rx="2" fill="#1a2332" stroke="#3d5060" stroke-width="1"/>
    <text x="50" y="15" text-anchor="middle" font-size="8" fill="#667788" font-family="sans-serif">SCHOOL</text>
  </g>

  <!-- Clock showing long hours -->
  <g transform="translate(85, 270)">
    <circle r="22" fill="#1a2332" stroke="#3d5060" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#e63946" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="4" stroke="#e63946" stroke-width="1.5" stroke-linecap="round"/>
    <circle r="2" fill="#e63946"/>
    <text x="0" y="36" text-anchor="middle" font-size="9" fill="#e63946" font-family="sans-serif" font-weight="bold">2h</text>
  </g>

  <!-- Arrow of transformation -->
  <g transform="translate(270, 240)">
    <rect x="-30" y="-16" width="60" height="32" rx="16" fill="#e63946" opacity="0.15"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#e63946" font-family="sans-serif" font-weight="bold">AI</text>
  </g>

  <!-- Person figure (center) -->
  <g transform="translate(300, 310)">
    <circle cx="0" cy="-45" r="18" fill="#253545" stroke="#4ecdc4" stroke-width="2"/>
    <path d="M-20 -20 Q-20 0, -15 20 L15 20 Q20 0, 20 -20 Q10 -27, 0 -27 Q-10 -27, -20 -20z" fill="#253545" stroke="#4ecdc4" stroke-width="1.5"/>
    <!-- Laptop -->
    <rect x="-18" y="-5" width="36" height="22" rx="3" fill="#1a2332" stroke="#4ecdc4" stroke-width="1.5"/>
    <rect x="-14" y="-1" width="28" height="14" rx="1" fill="#0d1b2a"/>
    <text x="0" y="9" text-anchor="middle" font-size="7" fill="#4ecdc4" font-family="monospace">&gt;_AI</text>
    <rect x="-22" y="17" width="44" height="3" rx="1.5" fill="#1a2332" stroke="#4ecdc4" stroke-width="1"/>
  </g>

  <!-- New life: freedom / laptop workspace -->
  <g transform="translate(440, 80)">
    <!-- Monitor -->
    <rect x="-40" y="0" width="80" height="55" rx="5" fill="#253545" stroke="#4ecdc4" stroke-width="1.5"/>
    <rect x="-34" y="6" width="68" height="40" rx="2" fill="#0d1b2a"/>
    <!-- Dashboard on screen -->
    <rect x="-28" y="12" width="18" height="10" rx="2" fill="#4ecdc4" opacity="0.3"/>
    <rect x="-28" y="26" width="18" height="10" rx="2" fill="#4ecdc4" opacity="0.2"/>
    <rect x="-6" y="12" width="28" height="24" rx="2" fill="#4ecdc4" opacity="0.15"/>
    <path d="M0 18 L6 28 L12 22 L18 30" stroke="#4ecdc4" stroke-width="1.5" fill="none" opacity="0.8"/>
    <rect x="-10" y="55" width="20" height="6" rx="1" fill="#253545" stroke="#4ecdc4" stroke-width="1"/>
    <rect x="-20" y="61" width="40" height="3" rx="1.5" fill="#253545" stroke="#4ecdc4" stroke-width="1"/>
    <text x="0" y="80" text-anchor="middle" font-size="9" fill="#4ecdc4" font-family="sans-serif" font-weight="bold">FREEDOM</text>
  </g>

  <!-- Clock showing efficiency -->
  <g transform="translate(510, 180)">
    <circle r="22" fill="#1a2332" stroke="#4ecdc4" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#4ecdc4" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="5" y2="-2" stroke="#4ecdc4" stroke-width="1.5" stroke-linecap="round"/>
    <circle r="2" fill="#4ecdc4"/>
    <text x="0" y="36" text-anchor="middle" font-size="9" fill="#4ecdc4" font-family="sans-serif" font-weight="bold">15min</text>
  </g>

  <!-- Floating elements -->
  <g opacity="0.4">
    <circle cx="200" cy="150" r="3" fill="#4ecdc4"/>
    <circle cx="350" cy="100" r="2" fill="#e63946"/>
    <circle cx="180" cy="200" r="2" fill="#4ecdc4"/>
    <circle cx="420" cy="250" r="3" fill="#4ecdc4"/>
    <circle cx="520" cy="300" r="2" fill="#e63946"/>
    <circle cx="280" cy="130" r="2.5" fill="#e63946"/>
    <rect x="230" y="170" width="5" height="5" rx="1" fill="#4ecdc4" transform="rotate(45 232.5 172.5)"/>
    <rect x="380" y="300" width="4" height="4" rx="1" fill="#e63946" transform="rotate(45 382 302)"/>
  </g>

  <!-- Connection lines (neural network style) -->
  <g stroke="#4ecdc4" stroke-width="0.5" opacity="0.2">
    <line x1="200" y1="150" x2="280" y2="130"/>
    <line x1="280" y1="130" x2="350" y2="100"/>
    <line x1="350" y1="100" x2="420" y2="250"/>
    <line x1="180" y1="200" x2="200" y2="150"/>
    <line x1="420" y1="250" x2="520" y2="300"/>
  </g>
</svg>
