<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="sg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#e8eef4"/>
    </linearGradient>
    <linearGradient id="timeline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="50%" stop-color="#c77dba"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#sg1)"/>

  <!-- Timeline -->
  <line x1="80" y1="200" x2="720" y2="200" stroke="url(#timeline)" stroke-width="3" stroke-linecap="round"/>

  <!-- Timeline nodes -->
  <!-- Node 1: Teaching -->
  <g transform="translate(140, 200)">
    <circle r="20" fill="#fff" stroke="#e63946" stroke-width="2.5"/>
    <rect x="-8" y="-8" width="16" height="12" rx="2" fill="none" stroke="#e63946" stroke-width="1.5"/>
    <line x1="-5" y1="-2" x2="5" y2="-2" stroke="#e63946" stroke-width="1"/>
    <line x1="-5" y1="1" x2="3" y2="1" stroke="#e63946" stroke-width="1"/>
    <text x="0" y="42" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">教員生活</text>
    <text x="0" y="56" text-anchor="middle" font-size="9" fill="#999" font-family="sans-serif">10年間</text>
  </g>

  <!-- Node 2: Struggle -->
  <g transform="translate(300, 200)">
    <circle r="20" fill="#fff" stroke="#d4768e" stroke-width="2.5"/>
    <text x="0" y="1" text-anchor="middle" font-size="16" fill="#d4768e" font-family="sans-serif">?</text>
    <text x="0" y="42" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">将来への不安</text>
    <text x="0" y="56" text-anchor="middle" font-size="9" fill="#999" font-family="sans-serif">選択肢がない</text>
  </g>

  <!-- Node 3: AI Discovery -->
  <g transform="translate(460, 200)">
    <circle r="20" fill="#fff" stroke="#8b7db8" stroke-width="2.5"/>
    <rect x="-8" y="-8" width="16" height="16" rx="3" fill="none" stroke="#8b7db8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#8b7db8"/>
    <line x1="-8" y1="-2" x2="-12" y2="-6" stroke="#8b7db8" stroke-width="1"/>
    <line x1="8" y1="-2" x2="12" y2="-6" stroke="#8b7db8" stroke-width="1"/>
    <line x1="-8" y1="2" x2="-12" y2="6" stroke="#8b7db8" stroke-width="1"/>
    <line x1="8" y1="2" x2="12" y2="6" stroke="#8b7db8" stroke-width="1"/>
    <text x="0" y="42" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">AI との出会い</text>
    <text x="0" y="56" text-anchor="middle" font-size="9" fill="#999" font-family="sans-serif">2h → 15min</text>
  </g>

  <!-- Node 4: Independence -->
  <g transform="translate(620, 200)">
    <circle r="24" fill="#4ecdc4" opacity="0.15"/>
    <circle r="20" fill="#fff" stroke="#4ecdc4" stroke-width="2.5"/>
    <path d="M-6 2 L0 -6 L6 2 M0 -6 v14" stroke="#4ecdc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="0" y="42" text-anchor="middle" font-size="11" fill="#333" font-family="sans-serif" font-weight="bold">独立・起業</text>
    <text x="0" y="56" text-anchor="middle" font-size="9" fill="#4ecdc4" font-family="sans-serif" font-weight="bold">自由な選択肢</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="200" cy="120" r="4" fill="#e63946" opacity="0.1"/>
  <circle cx="380" cy="300" r="6" fill="#4ecdc4" opacity="0.1"/>
  <circle cx="550" cy="100" r="5" fill="#4ecdc4" opacity="0.15"/>
  <circle cx="680" cy="320" r="4" fill="#4ecdc4" opacity="0.1"/>
</svg>
